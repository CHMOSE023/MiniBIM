# 把网页版部署到 Cloudflare Pages（项目 minibim，自定义域名 minibim.bimhub.top）
#   - build.yml 推送 v* 标签、创建 GitHub Release 之后调用本流程（workflow_call），部署该标签的网页版
#   - 也可以在 Actions 页面手动运行（workflow_dispatch），重新部署某个已发布的版本（默认最新版本）
# 网页版取自 GitHub Release 的 MiniBIM-<标签>-web.zip，不重新编译。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（权限 Account > Cloudflare Pages > Edit）、CLOUDFLARE_ACCOUNT_ID；
# 没设时跳过部署（fork 的仓库推标签不会因此失败）。Pages 项目 minibim 与自定义域名已在 Cloudflare 控制台里建好
# （Workers 和 Pages → 创建 → Pages → 拖放文件；用 API / wrangler 创建项目会返回 code 8000000）
name: Pages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的版本标签（例如 v0.2.0），留空为最新版本"
        type: string
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::没有设置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署"
          fi

      # 从 Release 取网页版的 zip，解压后的文件夹就是网站根目录（index.html / .js / .wasm / .data）
      - name: Download web build
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "MiniBIM-$TAG-web.zip"
          unzip -q "MiniBIM-$TAG-web.zip"
          mv "MiniBIM-$TAG-web" site
          ls -l site

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22

      # --branch main 即生产环境（项目的生产分支）
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name minibim --branch main --commit-dirty=true
